        function isViteOrWs(str) {
          if (!str) return false;
          var s = String(str);
          return s.indexOf('[vite]') !== -1 ||
                 s.indexOf('WebSocket') !== -1 ||
                 s.indexOf('websocket') !== -1 ||
                 s.indexOf('vite-plugin-pwa') !== -1;

        // 1. Intercept console.error and console.warn
        var origError = console.error;
        console.error = function() {
          var msg = '';

            var a = arguments[i];
            msg += ' ' + (typeof a === 'string' ? a : (a && a.message ? a.message : (a ? String(a) : '')));
          }
          if (isViteOrWs(msg)) {
            return;
          }
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          var msg = '';
          for (var i = 0; i < arguments.length; i++) {
            var a = arguments[i];
            msg += ' ' + (typeof a === 'string' ? a : (a && a.message ? a.message : ''));
          }
          if (isViteOrWs(msg)) {
            return;
          }
          origWarn.apply(console, arguments);
        };

        // 2. Intercept uncaught window error events from Vite client
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (isViteOrWs(msg)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // 3. Intercept unhandled promise rejections from Vite WebSocket client
        window.addEventListener('unhandledrejection', function(event) {
          var reason = (event && (event.reason && (event.reason.message || event.reason))) || '';
          if (isViteOrWs(reason)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
