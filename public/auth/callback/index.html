<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating with TraceXMail</title>
  <style>
    body {
      background: #13110e;
      color: #ede6d8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      text-align: center;
      padding: 28px 36px;
      border: 1px solid #3a352c;
      background: #1a1712;
      border-radius: 4px;
      max-width: 420px;
    }
    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 2px solid #3a352c;
      border-top-color: #c9a227;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <div style="font-size: 14px; font-weight: 500; letter-spacing: 0.02em;">Completing Authentication…</div>
    <div style="font-size: 12px; color: #9d9282; margin-top: 6px;">Closing window and returning to TraceXMail…</div>
  </div>
  <script>
    (function() {
      try {
        var hash = window.location.hash || '';
        var search = window.location.search || '';
        console.log('[SupabaseOAuthCallback] Processing auth redirect callback:', {
          hasHash: Boolean(hash),
          hasSearch: Boolean(search),
          origin: window.location.origin
        });

        // Check for error parameters in query or hash
        var searchParams = new URLSearchParams(search);
        var hashParams = new URLSearchParams(hash.replace(/^#/, ''));
        var error = searchParams.get('error') || hashParams.get('error') || searchParams.get('error_description') || hashParams.get('error_description');

        // Store in localStorage as backup bridge
        try {
          localStorage.setItem('tracexmail_supabase_auth_callback', JSON.stringify({
            hash: hash,
            search: search,
            error: error,
            timestamp: Date.now()
          }));
        } catch (e) {}

        if (window.opener && window.opener !== window) {
          if (error) {
            console.warn('[SupabaseOAuthCallback] Auth error in callback:', error);
            window.opener.postMessage({
              type: 'SUPABASE_AUTH_ERROR',
              error: error,
              hash: hash,
              search: search
            }, '*');
          } else {
            console.log('[SupabaseOAuthCallback] Posting auth success to opener');
            window.opener.postMessage({
              type: 'SUPABASE_AUTH_SUCCESS',
              hash: hash,
              search: search
            }, '*');
          }
          setTimeout(function() {
            try { window.close(); } catch (e) {}
          }, 600);
        } else {
          // Top-level redirect: preserve auth parameters and redirect to dashboard
          console.log('[SupabaseOAuthCallback] Standalone redirect to root with tokens');
          window.location.replace('/' + search + hash);
        }
      } catch (err) {
        console.error('[SupabaseOAuthCallback] Exception in callback:', err);
        window.location.replace('/');
      }
    })();
  </script>
</body>
</html>
